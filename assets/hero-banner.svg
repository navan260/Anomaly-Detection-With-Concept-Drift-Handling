<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" role="img" aria-label="Drift-Adaptive Streaming Anomaly Detection Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="glowFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 800 30px 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #F8FAFC; letter-spacing: -0.02em; }
      .subtitle { font: 500 14.5px 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #94A3B8; }
      .pill-text { font: 600 11.5px 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; fill: #E2E8F0; }
      .tag-text { font: 700 11px 'Inter', 'Segoe UI', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
      .legend { font: 500 12px 'Inter', 'Segoe UI', sans-serif; fill: #CBD5E1; }
      .stream-line {
        stroke-dasharray: 2400;
        stroke-dashoffset: 2400;
        animation: drawStream 3.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .base-line {
        stroke-dasharray: 8 6;
        animation: dashMove 1.4s linear infinite;
      }
      .pulse-ring {
        transform-origin: center;
        animation: pulseAlert 2.2s ease-out infinite;
      }
      @keyframes drawStream {
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -28; }
      }
      @keyframes pulseAlert {
        0% { opacity: 0.95; r: 6; stroke-width: 2.5; }
        75% { opacity: 0; r: 22; stroke-width: 0.8; }
        100% { opacity: 0; r: 24; stroke-width: 0.5; }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="370" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.65">
    <line x1="60" y1="130" x2="1140" y2="130"/>
    <line x1="60" y1="190" x2="1140" y2="190"/>
    <line x1="60" y1="250" x2="1140" y2="250"/>
    <line x1="60" y1="310" x2="1140" y2="310"/>
    <line x1="330" y1="115" x2="330" y2="315"/>
    <line x1="600" y1="115" x2="600" y2="315"/>
    <line x1="870" y1="115" x2="870" y2="315"/>
