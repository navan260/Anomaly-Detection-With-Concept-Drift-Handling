  <rect x="60" y="115" width="135" height="200" fill="#1E293B" opacity="0.45" rx="4"/>
  <text x="72" y="304" class="tag-text" fill="#64748B">Warm-up (N₀)</text>

  <!-- Header Content -->
  <text x="60" y="54" class="title">Drift-Adaptive Streaming Anomaly Detection</text>
  <text x="60" y="80" class="subtitle">Single-pass Half-Space Trees + ADWIN regime adaptation for non-stationary industrial &amp; defense sensor streams</text>

